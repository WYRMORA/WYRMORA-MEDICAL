services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wyrmora
      POSTGRES_PASSWORD: wyrmora_dev_password
      POSTGRES_DB: wyrmora
    ports:
      - "5432:5432"
    volumes:
      - wyrmora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wyrmora -d wyrmora"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wyrmora_pgdata:
