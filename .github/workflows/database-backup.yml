name: WYRMORA database backup

on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wyrmora-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wyrmora_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyrmora_restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check backup configuration
        env:
          DATABASE_URL: ${{ secrets.WYRMORA_DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$DATABASE_URL" ]] || missing+=("WYRMORA_DATABASE_URL")
          [[ -n "$BACKUP_S3_BUCKET" ]] || missing+=("BACKUP_S3_BUCKET")
          [[ -n "$BACKUP_S3_ENDPOINT" ]] || missing+=("BACKUP_S3_ENDPOINT")
          [[ -n "$BACKUP_S3_ACCESS_KEY_ID" ]] || missing+=("BACKUP_S3_ACCESS_KEY_ID")
          [[ -n "$BACKUP_S3_SECRET_ACCESS_KEY" ]] || missing+=("BACKUP_S3_SECRET_ACCESS_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Database backups are NOT active. Missing repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Install PostgreSQL and S3 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli

      - name: Create, restore-verify, upload and verify database backup
        env:
          DATABASE_URL: ${{ secrets.WYRMORA_DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backup_file="$(mktemp /tmp/wyrmora-db-XXXXXX.dump)"
          trap 'rm -f "$backup_file"' EXIT
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file="$backup_file"
          test -s "$backup_file"
          checksum="$(sha256sum "$backup_file" | awk '{print $1}')"
          echo "Backup SHA-256: $checksum"
          PGPASSWORD=postgres pg_restore --host=127.0.0.1 --port=5432 --username=postgres --dbname=wyrmora_restore_test --no-owner --no-acl --exit-on-error "$backup_file"
          backup_name="wyrmora-db-$(date -u +%Y%m%dT%H%M%SZ).dump"
          backup_key="database-backups/$backup_name"
          aws s3 cp "$backup_file" "s3://$BACKUP_S3_BUCKET/$backup_key" --endpoint-url "$BACKUP_S3_ENDPOINT" --metadata "sha256=$checksum" --only-show-errors
          uploaded_checksum="$(aws s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$backup_key" --endpoint-url "$BACKUP_S3_ENDPOINT" --query 'Metadata.sha256' --output text)"
          if [[ "$uploaded_checksum" != "$checksum" ]]; then
            echo "::error::Uploaded backup metadata checksum does not match the locally verified dump."
            exit 1
          fi
          echo "Backup restored successfully and upload verified: $backup_key"
