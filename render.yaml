# Render Blueprint: free tier is for testing only; free Postgres expires after 30 days.
services:
  - type: web
    name: wyrmora-medical-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix server && npm run migrate --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_NAME
        value: wyrmora_session
      - key: CLIENT_ORIGIN
        value: https://wyrmora-medical.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: wyrmora-medical-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: wyrmora-medical-db
    plan: free
    region: singapore
    databaseName: wyrmora_medical
    user: wyrmora_medical
